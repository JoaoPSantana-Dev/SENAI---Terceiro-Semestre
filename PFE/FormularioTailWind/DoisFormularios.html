<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario com TailWind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>




  <body class="bg-pink-300">
  
  <div class=" hover:transition delay-150 duration-300 ease-in-out hover:scale-102 hover:border border-blue-700  mx-auto max-w-sm gap-x-4 bg-white rounded-xl text-center flex items-center justify-center p-8 mt-5 shadow-lg outline outline-black ">
    <h2>Tela de cadastro</h2>
  </div>
  
  <div class="flex flex-row justify-center min-h-screen items-center gap-8 mt-10 p-4 ">

<!-- 
    <div class="min-h-screen min-w-screen flex items-center justify-center"> -->
      <div classname = "card" class = "bg-white p-8 rounded-4xl shadow-2xl hover:transition delay-150 duration-300 ease-in hover:scale-102 hover:border border-black">
          <h2 class="text-center text-2xl text-gray-800 font-bold mb-6">Cadastro</h2>
          
          <form id="formCadastro">
              <div>
              <label for="nome" class="block text-sm font-semibold">Nome</label>
              <input
  
                  type="text"
                  id = "nome"
                  placeholder="Digite seu nome"
                  class="mt-1 w-full px-3 py-2 border border-gray-400 rounded-2xl"
                  >
              </div>
  
              <div class="mt-8">
              <label for="senha" class="block text-sm font-semibold">Senha</label>
              <input
  
                  type="password"
                  id = "senha"
                  placeholder="Digite sua senha"
                  class="mt-1 w-full px-3 py-2 border border-gray-400 rounded-2xl"
                  >
              </div>

              <div class = "mt-8 text-center">
                <button type="button" class ="bg-red-300 focus:ring-4 focus:ring-brand-light shadow-xs font-medium leading-5 rounded-full text-sm px-4 py-2.5">Cadastrar
                </button>  
              </div>
          </form>
      </div>
 <!--    </div> -->



    <!-- <div class="min-h-screen min-w-screen flex items-center justify-center"> -->
    <div classname = "card" class = "bg-white p-8 rounded-4xl shadow-2xl hover:transition delay-150 duration-300 ease-in hover:scale-102 hover:border border-black">
        <h2 class="text-center text-2xl text-gray-800 font-bold mb-6">Login</h2>
        
        <form id="formCadastro">
            <div>
            <label for="nome" class="block text-sm font-semibold">Nome</label>
            <input

                type="text"
                id = "nome"
                placeholder="Digite seu nome"
                class="mt-1 w-full px-3 py-2 border border-gray-400 rounded-2xl"
                >
            </div>

            <div class="mt-8">
            <label for="senha" class="block text-sm font-semibold">Senha</label>
            <input

                type="password"
                id = "senha"
                placeholder="Digite sua senha"
                class="mt-1 w-full px-3 py-2 border border-gray-400 rounded-2xl"
                >
            </div>

            <div class = "mt-8 text-center">
              <button type="button" class ="bg-red-300 focus:ring-4 focus:ring-brand-light shadow-xs font-medium leading-5 rounded-full text-sm px-4 py-2.5">Login
              </button>  
            </div>
        </form>
    </div>
